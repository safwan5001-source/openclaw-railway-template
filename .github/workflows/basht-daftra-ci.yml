name: BASHT Daftra integration checks
on:
  pull_request:
    paths:
      - 'src/daftra-*'
      - 'src/daftra_*'
      - 'src/test_daftra_*'
      - '.github/workflows/basht-daftra-ci.yml'
  workflow_dispatch:
jobs:
  safe-export-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test read-only connector and CSV/JSON
        run: node --test src/daftra-readonly.test.mjs src/daftra-exports.test.mjs
      - name: Test XLSX and DOCX
        run: python3 -m unittest discover -s src -p test_daftra_office_export.py -v
