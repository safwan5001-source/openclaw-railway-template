name: BASHT Memory & Security Checks
# Read-only synthetic checks: pinned OpenClaw, WhatsApp owner identity, memory flush and E2E loopback fake model.
# No production credentials, remote deployment or live WhatsApp access.
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/basht-memory-security-ci.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'Dockerfile'
      - 'docs/MEMORY_FLUSH_OWNER_FIX.md'
      - '.github/workflows/basht-memory-security-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basht-memory-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openclaw-memory-flush:
    # BASHT memory-flush owner-identity patch: unit tests, integration against the real pinned OpenClaw dist, and the
    # end-to-end save -> compaction -> recall proof with a loopback fake model (no WhatsApp, no Railway, no real model).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install the PINNED OpenClaw (same version as the Dockerfile), scripts disabled
        run: |
          mkdir -p "$RUNNER_TEMP/flush/base" && cd "$RUNNER_TEMP/flush/base"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts openclaw@2026.10.9
      - name: Install OpenClaw + the real WhatsApp plugin for the owner-rule parity test (separate dir; the E2E keeps base)
        run: |
          mkdir -p "$RUNNER_TEMP/flush/parity" && cd "$RUNNER_TEMP/flush/parity"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts openclaw@2026.10.9 @openclaw/whatsapp@2026.10.9
      - name: Patch unit + integration tests (real OpenClaw tool policy, real WhatsApp owner rule)
        env:
          OPENCLAW_PACKAGE_ROOT: ${{ runner.temp }}/flush/parity/node_modules/openclaw
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/flush/state
        run: node --test --test-concurrency=1 patches/*.test.mjs
      - name: End-to-end (upstream reproduces the bug; patched owner saves and recalls; non-owners stay read-only)
        run: bash patches/e2e/memory-flush-e2e.sh "$RUNNER_TEMP/flush"
